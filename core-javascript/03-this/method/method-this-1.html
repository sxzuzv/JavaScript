<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수로서 호출, 메서드로서 호출</title>
</head>
<body>
    <script>
        var func = function (x) {
            console.log(this, x);
        };
        func(1);

        var obj = {
            method: func
        };
        obj.method(2);
    </script>
</body>
</html>
