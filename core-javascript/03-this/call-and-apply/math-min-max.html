<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call/apply 메서드의 활용 3-2</title>
</head>
<body>
    <script>
        var numbers = [1, 2, 3, 4, 5];

        var max = Math.max.apply(null, numbers);
        var min = Math.min.apply(null, numbers);

        console.log(max, min);
    </script>
</body>
</html>
