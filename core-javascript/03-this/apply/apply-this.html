<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>apply 메서드</title>
</head>
<body>
    <script>
        var func = function (a, b, c) {
            console.log(this, a, b, c);
        };
        func.apply({ x: 1 }, [4, 5, 6]);

        var obj = {
            a: 1,
            method: function (x, y) {
                console.log(this.a, x, y);
            }
        };
        obj.method.apply({ a: 4 }, [5, 6]);
    </script>
</body>
</html>
