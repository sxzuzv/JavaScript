<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부함수에 this 전달 - call vs bind</title>
</head>
<body>
    <script>
        var obj = {
            outer: function () {
                console.log(this);

                var innerFunc = function () {
                    console.log(this);
                };

                innerFunc.call(this);
            }
        };
        obj.outer();

        var obj2 = {
            outer: function () {
                console.log(this);

                var innerFunc = function () {
                    console.log(this);
                }.bind(this);

                innerFunc();
            }
        };
        obj2.outer();
    </script>
</body>
</html>
