<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부함수에 this 전달 - 콜백 함수</title>
</head>
<body>
    <script>
        var obj = {
            logThis: function () {
                console.log(this);
            },

            logThisLater1: function () {
                setTimeout(this.logThis, 500);
            },

            logThisLater2: function () {
                setTimeout(this.logThis.bind(this), 1000);
            }
        };

        obj.logThisLater1();
        obj.logThisLater2();
    </script>
</body>
</html>
