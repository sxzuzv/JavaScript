<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thisArg를 받는 경우 - forEach 메서드</title>
</head>
<body>
    <script>
        var report = {
            sum: 0,
            count: 0,
            add: function () {
                var args = Array.prototype.slice.call(arguments);

                args.forEach(function (entry) {
                    this.sum += entry;
                    ++this.count;
                }, this);
            },
            average: function () {
                return this.sum / this.count;
            }
        };

        report.add(10, 20, 30);
        console.log(report.sum, report.count, report.average()); // 60 3 20
    </script>
</body>
</html>
