<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call 메서드 (2)</title>
</head>
<body>
    <script>
        var obj = {
            a: 1,
            method: function (x, y) {
                console.log(this.a, x, y);
            }
        };

        obj.method(2, 3);
        obj.method.call({ a: 4 }, 5, 6);
    </script>
</body>
</html>
