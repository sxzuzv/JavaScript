<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call 메서드 (1)</title>
</head>
<body>
    <script>
        var func = function (a, b, c) {
            console.log(this, a, b, c);
        };

        func(1, 2, 3);
        func.call({ x: 1 }, 4, 5, 6);
    </script>
</body>
</html>
