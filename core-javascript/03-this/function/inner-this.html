<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부함수에서의 this</title>
</head>
<body>
    <script>
        var obj1 = {
            outer: function () {
                console.log(this);
                
                var innerFunc = function () {
                    console.log(this);
                };

                innerFunc();

                var obj2 = {
                    innerMethod: innerFunc
                };

                obj2.innerMethod();
            }
        };

        obj1.outer();
    </script>
</body>
</html>
