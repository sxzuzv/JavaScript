<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부함수에서의 this를 우회하는 방법</title>
</head>
<body>
    <script>
        var obj = {
            outer: function () {
                console.log(this);
                var innerFunc1 = function () {
                    console.log(this);
                };
                innerFunc1();

                var self = this;
                var innerFunc2 = function () {
                    console.log(self);
                };
                innerFunc2();
            }
        };

        obj.outer();
    </script>
</body>
</html>
