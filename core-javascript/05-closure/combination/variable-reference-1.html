<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>외부 함수의 변수를 참조하는 내부 함수(1)</title>
</head>
<body>
    <script>
        var outer = function () {
            var a = 1;

            var inner = function () {
                console.log(++a);
            };

            inner();
        };

        outer();
    </script>
</body>
</html>
