<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비동기 작업의 동기적 표현(2) - Promise(2)</title>
</head>
<body>
    <script>
        var addCoffee = function (name) {
            return function (prevName) {
                return new Promise (function (resolve) {
                    setTimeout(function () {
                        var newName = prevName ? (prevName + ', ' + name) : name;
                        console.log(newName);
                        resolve(newName);
                    }, 500);
                });
            };
        };

        addCoffee('말차라떼')()
            .then(addCoffee('아메리카노'))
            .then(addCoffee('카페모카'))
            .then(addCoffee('카페라떼'));
    </script>
</body>
</html>
