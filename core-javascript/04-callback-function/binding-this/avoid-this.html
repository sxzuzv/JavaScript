<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콜백 함수 내부에서 this를 사용하지 않은 경우</title>
</head>
<body>
    <script>
        var obj = {
            name: 'obj',
            func: function () {
                console.log(obj.name);
            }
        };

        setTimeout(obj.func, 1000);
    </script>
</body>
</html>
