<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콜백 함수 내부에서 this에 다른 값을 바인딩하는 방법 (1)</title>
</head>
<body>
    <script>
        var obj = {
            name: 'obj',
            func: function () {
                var self = this;

                return function () {
                    console.log(self.name);
                };
            }
        };

        var callback = obj.func();
        setTimeout(callback, 1000);
    </script>
</body>
</html>
