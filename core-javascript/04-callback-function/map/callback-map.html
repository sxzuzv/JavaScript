<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콜백 함수 예제 2-1</title>
</head>
<body>
    <script>
        var newArr = [10, 20, 30].map(function (currentValue, index) {
            console.log(currentValue, index);
            return currentValue + 3;
        });

        console.log(newArr);

        // -- 실행 결과 --
        // 10 0
        // 20 1
        // 30 2
        // [13, 23, 33]
    </script>
</body>
</html>
