<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콜백 지옥 예시</title>
</head>
<body>
    <script>
        setTimeout(function (name) {
            var coffeeList = name;
            console.log(coffeeList);

            setTimeout(function (name) {
                coffeeList += ', ' + name;
                console.log(coffeeList);

                setTimeout(function (name) {
                    coffeeList += ', ' + name;
                    console.log(coffeeList);

                    setTimeout(function (name) {
                        coffeeList += ', ' + name;
                        console.log(coffeeList);
                    }, 500, '카페라떼');
                }, 500, '카페모카');
            }, 500,'아메리카노');
        }, 500, '말차라떼');
    </script>
</body>
</html>
